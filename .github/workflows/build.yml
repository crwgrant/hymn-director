name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Prepare bundled database
        run: uv run init-db

      - name: Build app
        run: uv run pyinstaller --noconfirm hymn-director.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HymnDirector-${{ matrix.os }}
          path: dist/
